name: ShieldOps CI

on:
  push:
    paths-ignore: ['gitops/**']
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: shieldops-api

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check app/

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2

  tests:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt pytest httpx
      - name: Run tests
        run: python -m pytest -q

  docker-security:
    name: Docker Build, SBOM & Trivy Scan
    runs-on: ubuntu-latest
    needs: [lint, secret-scan, tests]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          GH_USER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=ghcr.io/$GH_USER/$IMAGE_NAME:${{ github.sha }}
          docker build -t $IMAGE_TAG ./app
          echo "BUILT_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Generate SBOM (Anchore Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BUILT_IMAGE }}
          artifact-name: sbom.spdx.json

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BUILT_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: [docker-security]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker image
        run: |
          GH_USER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          FULL_IMAGE=ghcr.io/$GH_USER/$IMAGE_NAME
          
          docker build -t $FULL_IMAGE:${{ github.sha }} -t $FULL_IMAGE:latest ./app
          docker push $FULL_IMAGE:${{ github.sha }}
          docker push $FULL_IMAGE:latest

  update-gitops:
    name: Update GitOps Tag
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Bump image tag
        run: |
          sed -i "s|image: ghcr.io/saadcheddad/shieldops-api:.*|image: ghcr.io/saadcheddad/shieldops-api:${GITHUB_SHA}|" gitops/workloads/shieldops-api/deployment.yaml
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "gitops: deploy ${GITHUB_SHA}" || exit 0
          git push