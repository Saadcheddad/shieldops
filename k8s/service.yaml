apiVersion: v1
kind: Service
metadata:
  name: shieldops-service
spec:
  type: LoadBalancer # Permet de créer un IP externe sur Azure pour accéder à ton app
  selector:
    app: shieldops # 
  ports:
    - protocol: TCP
      port: 80         # Le port sur lequel le service écoutera à l'extérieur
      targetPort: 8000   # Le port de ton conteneur (celui défini dans EXPOSE de ton Dockerfile)