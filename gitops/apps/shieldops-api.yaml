apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shieldops-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saadcheddad/shieldops.git
    targetRevision: main
    path: gitops/workloads/shieldops-api
  destination:
    server: https://kubernetes.default.svc
    namespace: shieldops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true