apiVersion: apps/v1
kind: Deployment
metadata:
  name: shieldops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shieldops
  template:
    metadata:
      labels:
        app: shieldops
    spec:
      containers:
      - name: app
        image: ghcr.io/saadcheddad/shieldops-api:2386786f4927bd3e2247855d87a08dd59b6b26be
        ports:
        - containerPort: 8000
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000