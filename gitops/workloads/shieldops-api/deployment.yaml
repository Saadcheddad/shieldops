apiVersion: apps/v1
kind: Deployment
metadata:
  name: shieldops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shieldops
  template:
    metadata:
      labels:
        app: shieldops
    spec:
      containers:
      - name: app
        image: ghcr.io/saadcheddad/shieldops-api:3e693e553b70699f6dc5383bfe92f9e781e16a29
        ports:
        - containerPort: 8000