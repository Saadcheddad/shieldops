apiVersion: apps/v1
kind: Deployment
metadata:
  name: shieldops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shieldops
  template:
    metadata:
      labels:
        app: shieldops
    spec:
      containers:
      - name: app
        image: ghcr.io/saadcheddad/shieldops-api:e3a0d3614be853fc9e7fb5c6c81307cdbb3ba9d9
        ports:
        - containerPort: 8000