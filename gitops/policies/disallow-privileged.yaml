apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: validate-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - falco
      validate:
        message: "Privileged mode is strictly forbidden."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): false
