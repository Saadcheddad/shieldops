apiVersion: wgpolicyk8s.io/v1alpha2
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - falco
      validate:
        message: "Running as root is disallowed."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true